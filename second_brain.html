        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"category": "Geography", "color": "#97c2fc", "font": {"color": "white"}, "id": "Paris", "label": "Paris", "shape": "dot", "size": 34, "title": "Paris\nCategory: Geography\nCapital city of France"}, {"category": "Geography", "color": "#97c2fc", "font": {"color": "white"}, "id": "France", "label": "France", "shape": "dot", "size": 34, "title": "France\nCategory: Geography\nCountry in western Europe"}, {"category": "Technology", "color": "#97c2fc", "font": {"color": "white"}, "id": "Python", "label": "Python", "shape": "dot", "size": 28, "title": "Python\nCategory: Technology\nA programming language"}, {"category": "Person", "color": "#97c2fc", "font": {"color": "white"}, "id": "Wiktoria", "label": "Wiktoria", "shape": "dot", "size": 40, "title": "Wiktoria\nCategory: Person\nThe architect of this second brain"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "Paris", "label": "capital of", "to": "France"}, {"arrows": "to", "from": "France", "label": "contains capital", "to": "Paris"}, {"arrows": "to", "from": "Wiktoria", "label": "is learning", "to": "Python"}, {"arrows": "to", "from": "Wiktoria", "label": "wants to visit", "to": "Paris"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"shape": "dot", "borderWidth": 2, "font": {"size": 0}}, "edges": {"arrows": {"to": {"enabled": true, "scaleFactor": 0.6}}, "smooth": {"type": "curvedCW", "roundness": 0.2}, "font": {"face": "Menlo", "size": 11, "color": "#c8c8d8", "strokeWidth": 0, "background": "#1a1a2e"}}, "physics": {"enabled": true, "stabilization": {"iterations": 100}, "barnesHut": {"gravitationalConstant": -8000, "springConstant": 0.001, "springLength": 200}}, "interaction": {"hover": true, "tooltipDelay": 100}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>

<style>

<div id="brain-panel">
    <h1> SECOND BRAIN</h1>
    <div class="label">Colour</div>
    <div class="swatches" id="swatches"></div>
    <div class="label">Categories</div>
    <div class="legend" id="legend"></div>
</div>

<script>
    (function () {
        if (typeof network === "undefined" || typeof nodes === "undefined") return;

        const FONT = 'Menlo, Monaco, "Courier New", monospace';
        const LABEL_PX = 12;
        const FIT = 0.82;
        const STORAGE_KEY = "second-brain-colour";
        const PRESETS = [
            ["Plum", "#7b4fd6"], ["Ocean", "#2f7fd8"], ["Teal", "#1fa39a"],
    ["Moss", "#5f9a3a"], ["Amber", "#d9902a"], ["Rose", "#d6466a"],
    ["Slate", "#7a8699"]
  ];

  function hexToHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }
  const hsl = (h, s, l) => `hsl(${h}, ${s}%, ${l}%)`;

  const categories = [...new Set(nodes.get().map(n => n.category))].sort();
  function lightnessFor(category) {
    if (categories.length === 1) return 55;
    const i = categories.indexOf(category);
    return Math.round(32 + i * (42 / (categories.length - 1)));
  }

  function renderLegend(h, s) {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    categories.forEach(cat => {
        const row = document.createElement("div");
        row.ClassName = "legend-row";
        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.background = hsl(h, s, lightnessFor(cat));
        const name = document.createElement("span");
        name.textContent = cat;
        row.append(dot, name);
        legend.appendChild(row);
    });
  }

  function applyColour(hex) {
    const base = hexToHsl(hex);
    const s = Math.min(Math.max(base.s, 35), 75);

    nodes.update(nodes.get().map(n => {
        const l = lightnessFor(n.category);
        return {
            id: n.id,
            textColour: l > 58 ? "#15151f" : "#ffffff",
            color: {
                background: hsl(base.h, s, l),
                border: hsl(base.h, s, Math.max(l-14,12)),
                highlight: { background: hsl(base.h, s, Math.min(l +10, 90)), border: "#ffffff" },
                hover: { background: hsl(base.h, s, Math.min(l + 6, 90)), border: hsl(base.h, s, Math.max(l -14, 12)) }
            }
        };; 
    }));

    edges.update(edges.get().map(e => ({
        id: e.id,
        color: {color: hsl(base.h, 15, 45), highlight: hsl(base.h, 40, 80), hover: hsl(base.h, 40, 80) }
    })));

    renderLegend(base.h, s);
    document.querySelectorAll(".swatch").forEach(btn =>
        btn.setAttribute("aria-pressed", String(btn.dataset.hex === hex)));
    document.getElementById("custom-colour").value = hex;
    try { localStorage.setItem(STORAGE_KEY, hex); } catch (e) { /* not available: ignore */ }
    }

    const row = document.getElementById("swatches");
    PRESETS.forEach(([name, hex]) => {
        const btn = document.createElement("button");
        btn.className = "swatch";
        btn.title = name;
        btn.setAttribute("aria-label", name);
        btn.dataset.hex = hex;
        btn.style.background = hex;
        btn.addEventListener("click", () => applyColour(hex));
        row.appendChild(btn);
    });
    const custom = document.createElement("input");
    custom.type = "color";
    custom.id = "custom-colour";
    custom.title = "Pick any colour";
    custom.addEventListener("input", e => applyColour(e.target.value));
    row.appendChild(custom);

    network.on("afterDrawing", ctx => {
        const scale = network.getScale();
        const positions = network.getPositions();
        ctx.font = `600 ${LABEL_PX / scale}px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        nodes.get().forEach(n => {
            const p = positions[n.id];
            if (!p) return;
            if (ctx.measureText(n.label).width <= n.size *2 * FIT) {
                ctx.fillStyle = n.textColour || "#ffffff";
                ctx.fillText(n.label, p.x, p.y);
            }
        });
    });

    let start = PRESETS[0][1];
    try { start = localStorage.getItem(STORAGE_KEY) || start; } catch (e) { /* ignore */ }
    applyColour(start);
})();
</script>
