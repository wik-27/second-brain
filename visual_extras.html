<!-- visual_extras.html
     Browser code that visualise.py adds to the generated page.
     It runs live in the browser, after Python has finished. -->

<style>
    #brain-panel {
        position: fixed; top: 16px; left: 16px; z-index: 20;
        display: grid; gap: 10px; max-width: 260px;
        padding: 14px 16px; border-radius: 12px;
        background: rgba(26, 26, 46, 0.92); border: 1px solid #36365c;
        color: #ecebf5; font: 12px Menlo, Monaco, "Courier New", monospace;
    }
    #brain-panel h1 { margin: 0; font-size: 13px; letter-spacing: 0.08em; }
    #brain-panel .label { color: #a4a4c4; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .swatch {
        width: 22px; height: 22px; padding: 0; border-radius: 50%;
        border: 2px solid transparent; cursor: pointer;
    }
    .swatch[aria-pressed = "true"] { border-color: #ffffff; }
    .swatch:focus-visible, #custom-colour:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
    #custom-colour { width: 28px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; }
    .legend {display: grid; gap: 4px; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

    div.vis-tooltip {
        font-family: Menlo, Monaco, "Courier New", monospace !important;
        font-size: 12px !important;
        background: #22223b !important; color: #ecebf5 !important;
        border: 1px solid #36365c !important; border-radius: 6px !important;
        padding: 8px 10px !important;
    }
</style>

<div id="brain-panel">
    <h1> SECOND BRAIN</h1>
    <div class="label">Colour</div>
    <div class="swatches" id="swatches"></div>
    <div class="label">Categories</div>
    <div class="legend" id="legend"></div>
</div>

<script>
    (function () {
        if (typeof network === "undefined" || typeof nodes === "undefined") return;

        const FONT = 'Menlo, Monaco, "Courier New", monospace';
        const LABEL_PX = 12;
        const FIT = 0.82;
        const STORAGE_KEY = "second-brain-colour";
        const PRESETS = [
            ["Plum", "#7b4fd6"], ["Ocean", "#2f7fd8"], ["Teal", "#1fa39a"],
    ["Moss", "#5f9a3a"], ["Amber", "#d9902a"], ["Rose", "#d6466a"],
    ["Slate", "#7a8699"]
  ];

  function hexToHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }
  const hsl = (h, s, l) => `hsl(${h}, ${s}%, ${l}%)`;

  const categories = [...new Set(nodes.get().map(n => n.category))].sort();
  function lightnessFor(category) {
    if (categories.length === 1) return 55;
    const i = categories.indexOf(category);
    return Math.round(32 + i * (42 / (categories.length - 1)));
  }

  function renderLegend(h, s) {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    categories.forEach(cat => {
        const row = document.createElement("div");
        row.ClassName = "legend-row";
        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.background = hsl(h, s, lightnessFor(cat));
        const name = document.createElement("span");
        name.textContent = cat;
        row.append(dot, name);
        legend.appendChild(row);
    });
  }

  function applyColour(hex) {
    const base = hexToHsl(hex);
    const s = Math.min(Math.max(base.s, 35), 75);

    nodes.update(nodes.get().map(n => {
        const l = lightnessFor(n.category);
        return {
            id: n.id,
            textColour: l > 58 ? "#15151f" : "#ffffff",
            color: {
                background: hsl(base.h, s, l),
                border: nsl(base.h, s, Math.max(l-14,12)),
                highlight: { background: hsl(base.h, s, Math.min(l +10, 90)), border: "#ffffff" },
                hover: { background: hsl(base.h, s, Math.min(l + 6, 90)), border: hsl(base.h, s, Math.max(l -14, 12)) }
            }
        };; 
    }));

    edges.update(edges.get().map(e => ({
        id: e.id,
        color: {color: hsl(base.h, 15, 45), highlight: hsl(base.h, 40, 80), hover: hsl(base.h, 40, 80) }
    })));

    renderLegend(base.h, s);
    document.querySelectorAll(".swatch").forEaach(btn =>
        btn.setAttribute("aria-pressed", String(btn.dataset.hex === hex)));
    document.getElementById("custom-colour").value = hex;
    try { localStorage.setItem(STORAGE_KEY, hex); } catch (e) { /* not available: ignore */ }
    }

    const row = document.getElementById("swatches");
    PRESETS.forEach(([name, hex]) => {
        const btn = document.createElement("button");
        btn.className = "swatch";
        btn.title = name;
        btn.setAttribute("aria-label", name);
        btn.dataset.hex = hex;
        btn.addEventListener("click", () => applyColour(hex));
        row.appendChild(btn);
    });
    const custom = document.createElement("input");
    custom.type = "color";
    custom.id = "custom-colour";
    custom.title = "Pick any colour";
    custom.addEventListener("input", e => applyColour(e.target.value));
    row.appendChild(custom);

    network.on("afterDrawing", ctx => {
        const scale = network.getScale();
        const positions = network.getPositions();
        ctx.font = `600 ${LABEL_PX / scale}px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        nodes.get().forEach(n => {
            const p = positions[n.id];
            if (!p) return;
            if (ctx.measureText(n.label).width <= n.size *2 * FIT) {
                ctx.fillStyle = n.textColour || "#ffffff";
                ctx.fillText(n.label, p.x, p.y);
            }
        });
    });

    let start = PRESETS[0][1];
    try { start = localStorage.getItem(STORAGE_KEY) || start; } catch (e) { /* ignore */ }
    applyColour(start);
})();
</script>
